<form class="signup" data-endpoint="" novalidate>
  <label for="signup-email">Get updates on our current projects</label>
  <div class="signup-row">
    <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
    <button class="btn btn-primary" type="submit">Sign up</button>
  </div>
  <p class="signup-status" role="status" hidden></p>
</form>
