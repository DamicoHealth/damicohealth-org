<form class="signup signup-light" data-endpoint="" novalidate>
  <label for="signup-email-page">Email address</label>
  <div class="signup-row">
    <input id="signup-email-page" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button class="btn btn-primary" type="submit">Sign up</button>
  </div>
  <p class="signup-status" role="status" hidden></p>
</form>
