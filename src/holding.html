<head>

<meta property="og:title" content="Damico Health">

{{fonts}}
<style>
:root { color-scheme: dark; --navy: #16233F; --navy-deep: #0E1830; --orange: #F68630; --white: #FFFFFF; --soft: #C5CFE2; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--navy); color: var(--white);
  font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
  font-size: 1.125rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.holding {
  min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 5vw, 3rem);
  padding-top: calc(clamp(2rem, 6vw, 4rem) + env(safe-area-inset-top, 0px));
  padding-bottom: calc(clamp(2rem, 6vw, 4rem) + env(safe-area-inset-bottom, 0px));
  gap: 1.25rem;
}
.org { font-family: "Gabarito", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 600; font-size: clamp(1.25rem, 1rem + 1vw, 1.625rem); color: var(--orange); margin: 0; }
h1 {
  font-family: "Gabarito", "Trebuchet MS", "Segoe UI", sans-serif; font-weight: 700;
  font-size: clamp(2.5rem, 2rem + 4vw, 5rem); line-height: 1.02; letter-spacing: -0.025em; margin: 0; max-width: 12em; text-wrap: balance;
}
@media (prefers-reduced-motion: no-preference) {
  .holding > * { animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .holding > :nth-child(2) { animation-delay: 0.12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(0.75rem); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<main class="holding">
  <p class="org">Damico Health</p>
  <h1>Thank you for the journey.</h1>
</main>
</body>
</html>
